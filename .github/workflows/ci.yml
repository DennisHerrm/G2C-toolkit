# CI: every pull request is built and tested the same way as a release -
# so a change shows a green or red check before it is merged, and nothing
# broken ever reaches main (and with it the snapshot download).
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
